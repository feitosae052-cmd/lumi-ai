<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Lumi AI</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat {
      width: 400px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
    }

    input {
      width: 80%;
      padding: 10px;
    }

    button {
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="chat">
  <h2>Lumi AI</h2>

  <div class="messages" id="chat"></div>

  <input id="input" placeholder="Fale com a Lumi...">
  <button onclick="send()">Enviar</button>
</div>

<script>
async function send() {
  let input = document.getElementById("input");
  let chat = document.getElementById("chat");

  let userText = input.value;

  if (!userText) return;

  chat.innerHTML += "<p><b>Você:</b> " + userText + "</p>";

  input.value = "";

  try {
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyB0bVQF02l0ZyUGCEWa2J3M8VwDX7jDFKA,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: "Você é a Lumi AI, uma assistente amigável para adolescentes de 10 a 18 anos. Seja natural, leve e segura. Usuário disse: " + userText
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    let resposta =
      data?.candidates?.[0]?.content?.parts?.[0]?.text ||
      "Desculpa, não consegui responder agora.";

    chat.innerHTML += "<p><b>Lumi:</b> " + resposta + "</p>";

  } catch (error) {
    chat.innerHTML += "<p><b>Lumi:</b> Erro ao conectar com a IA.</p>";
  }
}
</script>

</body>
</html>
